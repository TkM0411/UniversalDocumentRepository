<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud File Manager – Sign In</title>

  <!-- Bootstrap 5.3 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="app-icon">☁️</div>
    <h1>Cloud File Manager</h1>
    <p class="subtitle">Securely store, annotate, and retrieve your files from anywhere.</p>

    <button id="btn-login" class="btn btn-brand btn-lg w-100 mb-3" onclick="AUTH.login()">
      <i class="bi bi-box-arrow-in-right me-2"></i>Sign in with your account
    </button>

    <p class="text-muted" style="font-size:0.82rem;">
      Don't have an account?
      <a href="#" onclick="AUTH.login(); return false;" class="text-decoration-none">
        Sign up
      </a>
      via the login screen.
    </p>
  </div>
</div>

<!-- Scripts -->
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
  // If the user already has a valid session, skip the login screen.
  if (AUTH.isAuthenticated()) {
    window.location.replace("dashboard.html");
  }
</script>

</body>
</html>

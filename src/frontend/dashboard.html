<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud File Manager – My Files</title>

  <!-- Bootstrap 5.3 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<!-- ================================================================
     Page-level spinner (shown while loading files or authenticating)
     ================================================================ -->
<div id="page-spinner" style="display:none;">
  <div class="spinner-border text-primary" role="status" style="width:3rem;height:3rem;">
    <span class="visually-hidden">Loading…</span>
  </div>
</div>

<!-- ================================================================
     Toast container
     ================================================================ -->
<div id="toast-container" class="cfm-toast"></div>

<!-- ================================================================
     Navbar
     ================================================================ -->
<nav class="navbar sticky-top px-3 py-2">
  <span class="navbar-brand">
    <i class="bi bi-cloud me-1"></i>Cloud File Manager
  </span>
  <div class="d-flex align-items-center gap-3">
    <span class="text-muted small d-none d-sm-inline">
      <i class="bi bi-person-circle me-1"></i>
      <span id="user-email">…</span>
    </span>
    <button
      class="btn btn-sm btn-outline-secondary"
      onclick="AUTH.logout()"
      title="Sign out"
    >
      <i class="bi bi-box-arrow-right me-1"></i>Sign out
    </button>
  </div>
</nav>

<!-- ================================================================
     Main content
     ================================================================ -->
<div class="container py-4" style="max-width: 960px;">

  <!-- Upload card -->
  <div class="cfm-card p-4 mb-4">
    <h5 class="fw-semibold mb-3">
      <i class="bi bi-cloud-upload me-2 text-primary"></i>Upload a file
    </h5>

    <!-- Drag-and-drop zone -->
    <div id="upload-zone" class="upload-zone mb-3">
      <div class="upload-icon"><i class="bi bi-file-earmark-arrow-up"></i></div>
      <p><strong>Click to browse</strong> or drag and drop your file here</p>
      <p class="mt-1" style="font-size:0.8rem;">Max 500 MB per file</p>
      <input id="file-input" type="file" class="d-none" />
    </div>

    <!-- Annotation field -->
    <div class="mb-3">
      <label for="upload-annotation" class="form-label fw-medium">
        Annotation <span class="text-muted fw-normal">(optional)</span>
      </label>
      <input
        id="upload-annotation"
        type="text"
        class="form-control"
        placeholder="Add a short description or note about this file…"
        maxlength="500"
      />
    </div>

    <!-- Progress bar -->
    <div id="upload-progress-wrapper" class="mb-2">
      <div class="d-flex justify-content-between small text-muted mb-1">
        <span>Uploading…</span>
        <span id="upload-pct">0%</span>
      </div>
      <div class="progress" style="height: 8px;">
        <div
          id="upload-progress-bar"
          class="progress-bar progress-bar-striped progress-bar-animated bg-primary"
          role="progressbar"
          style="width: 0%;"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        ></div>
      </div>
    </div>
  </div>

  <!-- Files card -->
  <div class="cfm-card">
    <div class="d-flex align-items-center justify-content-between p-3 border-bottom">
      <h5 class="fw-semibold mb-0">
        <i class="bi bi-folder2-open me-2 text-primary"></i>My Files
      </h5>
      <button class="btn btn-sm btn-outline-primary" onclick="loadFiles()">
        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
      </button>
    </div>

    <!-- Empty state -->
    <div id="empty-state" class="empty-state d-none">
      <div class="empty-icon"><i class="bi bi-inbox"></i></div>
      <p class="fw-medium mb-1">No files yet</p>
      <p class="small">Upload your first file using the panel above.</p>
    </div>

    <!-- File table -->
    <div class="table-responsive">
      <table class="table file-table mb-0">
        <thead>
          <tr>
            <th>File</th>
            <th>Uploaded</th>
            <th>Size</th>
            <th>Annotation</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="file-table-body"></tbody>
      </table>
    </div>
  </div>

</div><!-- /container -->

<!-- ================================================================
     Annotation edit modal
     ================================================================ -->
<div
  class="modal fade"
  id="annotation-modal"
  tabindex="-1"
  aria-labelledby="annotation-modal-label"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-semibold" id="annotation-modal-label">
          <i class="bi bi-pencil me-2 text-warning"></i>Edit Annotation
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body pt-2">
        <label for="annotation-textarea" class="form-label text-muted small">
          Add a description, tags, or notes about this file (max 500 characters).
        </label>
        <textarea
          id="annotation-textarea"
          class="form-control"
          rows="4"
          maxlength="500"
          placeholder="Enter annotation…"
        ></textarea>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-brand" id="btn-save-annotation">
          <i class="bi bi-check2 me-1"></i>Save
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ================================================================
     Scripts
     ================================================================ -->
<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmGQD8fAfLo6VHkVJP8EGFkqFPZh"
  crossorigin="anonymous"
></script>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud File Manager – Signing in…</title>

  <!-- Bootstrap 5.3 -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    .callback-card {
      max-width: 380px;
      margin: 15vh auto;
      text-align: center;
      background: #fff;
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 16px rgba(0,0,0,.10);
    }
  </style>
</head>
<body style="background: linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh;">

<div class="callback-card">
  <div class="spinner-border text-primary mb-3" role="status" style="width:2.5rem;height:2.5rem;">
    <span class="visually-hidden">Loading…</span>
  </div>
  <h5 class="mb-1">Signing you in…</h5>
  <p class="text-muted" style="font-size:.88rem;" id="status-text">
    Exchanging authorisation code for tokens.
  </p>
  <p id="error-text" class="text-danger d-none" style="font-size:.85rem;"></p>
</div>

<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script>
(async () => {
  const params = new URLSearchParams(window.location.search);
  const code   = params.get("code");
  const state  = params.get("state");
  const error  = params.get("error");

  const statusEl = document.getElementById("status-text");
  const errorEl  = document.getElementById("error-text");

  // ---- Cognito returned an error ----
  if (error) {
    statusEl.classList.add("d-none");
    errorEl.classList.remove("d-none");
    errorEl.textContent = `Login failed: ${error} – ${params.get("error_description") ?? ""}`;
    setTimeout(() => window.location.replace("index.html"), 4000);
    return;
  }

  if (!code || !state) {
    window.location.replace("index.html");
    return;
  }

  try {
    // 1. Exchange authorization code for tokens (PKCE)
    await AUTH.handleCallback(code, state);

    // 2. Initialise the user's S3 prefix (idempotent – safe every login)
    statusEl.textContent = "Setting up your workspace…";
    await AUTH.api("/api/users/setup", { method: "POST" });

    // 3. Redirect to the dashboard
    window.location.replace("dashboard.html");

  } catch (err) {
    console.error("Callback error:", err);
    statusEl.classList.add("d-none");
    errorEl.classList.remove("d-none");
    errorEl.textContent = err.message ?? "An unexpected error occurred.";
    setTimeout(() => window.location.replace("index.html"), 5000);
  }
})();
</script>

</body>
</html>
